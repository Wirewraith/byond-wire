[package]
name = "byond-wire"
version = "0.1.2"
edition = "2021"
description = "Small standard-library BYOND Topic client"
license = "MIT"
repository = "https://github.com/Wirewraith/byond-wire"
readme = "README.md"
include = ["*.rs", "tests/*.rs", "tests/text-vectors.tsv", "README.md", "LICENSE"]

[lib]
path = "byond-wire.rs"

[[bin]]
name = "byond-wire"
path = "cli.rs"
