name: Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Implementation to release
        type: choice
        default: all
        options: [all, python, nodejs, rust, php, powershell, csharp, go]
      bump:
        description: Version increment (current publishes without a bump)
        type: choice
        default: patch
        options: [patch, minor, major, current]

permissions:
  contents: read

# Serialize version commits, including releases of different implementations.
concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/ci.yml
  prepare:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tags: ${{ steps.plan.outputs.tags }}
    env:
      PACKAGE: ${{ inputs.package }}
      BUMP: ${{ inputs.bump }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require the validated default-branch revision
        run: |
          git fetch origin "refs/heads/$DEFAULT_BRANCH"
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo 'Default branch changed during validation; start a new Release run.' >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Plan versions and reject existing tags
        id: plan
        run: |
          python3 packaging/bump.py --package "$PACKAGE" --bump "$BUMP" > "$RUNNER_TEMP/release-plan.json"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          plan = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'release-plan.json').read_text())
          for tag in plan['tags']:
              result = subprocess.run(['git', 'show-ref', '--verify', '--quiet', f'refs/tags/{tag}'])
              if result.returncode == 0:
                  raise SystemExit(f'{tag} already exists; retry Publish package on that tag instead')
              if result.returncode != 1:
                  raise SystemExit(f'Could not check tag {tag}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tags=' + json.dumps(plan['tags']) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Release versions\n\n')
              for package, value in plan['versions'].items():
                  summary.write(f"- {package}: {value['before']} → {value['after']}\n")
              summary.write('\nEach tag starts a separate Publish package run.\n')
          PY
      - name: Commit versions and push branch and tags atomically
        run: |
          python3 packaging/bump.py --package "$PACKAGE" --bump "$BUMP" --write > /dev/null
          python3 -m unittest discover -s packaging
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          plan = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'release-plan.json').read_text())
          if plan['files']:
              subprocess.run(['git', 'add', '--', *plan['files']], check=True)
              subprocess.run(['git', 'commit', '-m', 'Release ' + ', '.join(plan['tags'])], check=True)
          for tag in plan['tags']:
              subprocess.run(['git', 'tag', tag], check=True)
          subprocess.run(['git', 'push', '--atomic', 'origin',
                          'HEAD:refs/heads/' + os.environ['DEFAULT_BRANCH'],
                          *('refs/tags/' + tag for tag in plan['tags'])], check=True)
          PY
  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.prepare.outputs.tags) }}
    steps:
      - name: Start publisher on the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ matrix.tag }}
        # GITHUB_TOKEN pushes do not trigger push workflows; dispatch does.
        run: gh workflow run publish.yml --ref "$RELEASE_TAG"
